# Publishes a GitHub Release when a vX.Y.Z tag is pushed (DESIGN §9).
# Every step must pass before `gh release create`, the last step: a version mismatch or a failing test
# stops the job before anything is published. A tag is never moved; a failed release is re-run or
# superseded by the next patch version.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and branches, so the next step can see origin/master.
          fetch-depth: 0

      # Releases are tagged on master (DESIGN §9): a tag on a commit that never passed the master PR gates
      # stops here. This guards against tagging the wrong commit; anyone who can push tags can also change
      # this file, so it is not access control.
      - name: Check the tag is on master
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master; tag a commit of master."
            exit 1
          fi

      # setup-uv publishes no major tags (v10 does not exist), so the release is pinned in full.
      # No cache: the release artifacts are built from a clean environment.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install
        run: uv sync --locked

      - name: Check the version
        shell: bash
        run: uv run python tools/release_check.py check "$GITHUB_REF_NAME"

      - name: Test
        run: uv run pytest -q --tb=short

      - name: Build
        run: uv build

      - name: Release notes
        shell: bash
        run: uv run python tools/release_check.py notes "${GITHUB_REF_NAME#v}" release-notes.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz
          --title "spec-kit-ac ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag

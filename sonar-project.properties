# SonarQube Cloud settings for the CI analysis (.github/workflows/sonar.yml).
sonar.organization=theyur
sonar.projectKey=theyur_spec-kit-ac
sonar.host.url=https://sonarcloud.io

sonar.sources=src,tools
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Block the job until the quality gate is computed, and fail it when the gate is red.
sonar.qualitygate.wait=true
